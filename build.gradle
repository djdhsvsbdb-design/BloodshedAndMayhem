plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.jkgames.gta'
    compileSdk 35

    defaultConfig {
        applicationId 'com.jkgames.gta'
        minSdk 8
        targetSdk 28
        versionCode 1
        versionName '1.0'
    }

    sourceSets {
        main {
            manifest.srcFile 'AndroidManifest.xml'
            java.srcDirs = ['src']
            res.srcDirs = ['res']
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
