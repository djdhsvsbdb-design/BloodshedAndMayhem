name: Android build

on:
  push:
    branches:
      - master
      - "build/**"
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Assemble debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Locate and stage generated APK
        shell: bash
        run: |
          APK_PATH="$(find . -type f -name '*.apk' ! -path './bin/*' -print -quit)"
          if [ -z "$APK_PATH" ]; then
            echo "No generated APK found. APK files in workspace:"
            find . -type f -name '*.apk' -print
            exit 1
          fi
          echo "Found APK: $APK_PATH"
          cp "$APK_PATH" app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 14
